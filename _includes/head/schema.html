{% assign site_url = '/' | absolute_url %}
{% assign logo_url = site.logo | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": {{ site_url | append: "#website" | jsonify }},
      "url": {{ site_url | jsonify }},
      "name": {{ site.name | jsonify }},
      "inLanguage": {{ site.lang | jsonify }},
      "publisher": { "@id": {{ site_url | append: "#organization" | jsonify }} }
    },
    {
      "@type": "Organization",
      "@id": {{ site_url | append: "#organization" | jsonify }},
      "name": {{ site.name | jsonify }},
      "url": {{ site_url | jsonify }},
      "logo": {
        "@type": "ImageObject",
        "url": {{ logo_url | jsonify }}
      },
      "sameAs": [
        {{ "https://www.instagram.com/logiashogath/" | jsonify }}
      ]
    }
  ]
}
</script>
