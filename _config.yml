encoding: utf-8
title: "Logia Ashogath"
name: "Logia Ashogath"
description: >-
  Círculo de escritoras y escritores de ciencia ficción, fantasía y terror.
  Lee el fanzine, explora relatos y conoce a sus autores.
lang: es
baseurl: "/ashogath"
url: "https://ignaciogaldames.com"
logo: /assets/images/logo-ashogath.jpg
timezone: America/Santiago

instagram_username: logiashogath
twitter_username: ""
github_username: ""
linkedin_username: ""
facebook_username: ""
youtube_username: ""
pinterest_username: ""
behance_username: ""
flickr_username: ""
tumblr_username: ""

markdown: kramdown
permalink: pretty
show_excerpts: true

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  authors:
    output: true
    permalink: /autores/:name/
  works:
    output: true
    permalink: /obras/:name/
  issues:
    output: true
    permalink: /fanzines/:name/
  topics:
    output: true
    permalink: /temas/:name/
  podcast:
    output: true
    permalink: /podcast/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: authors
    values:
      layout: author
  - scope:
      path: ""
      type: works
    values:
      layout: work
  - scope:
      path: ""
      type: issues
    values:
      layout: issue
  - scope:
      path: ""
      type: topics
    values:
      layout: topic
  - scope:
      path: ""
      type: podcast
    values:
      layout: podcast_item
  - scope:
      path: assets
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .ruby-version
  - .pages.yml
  - PRODUCT.md
  - README.md
  - LICENSE
